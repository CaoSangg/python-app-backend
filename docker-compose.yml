version: "3.8"

volumes:
  postgres_data:
    driver: local

services:

  # ── PostgreSQL 16 ─────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: songs_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── FastAPI Application (multi-stage, non-root) ───────────
  web:
    build:
      context: ./project
      dockerfile: Dockerfile
      target: runtime          # chỉ build tới stage "runtime"
    container_name: songs_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: >
      uvicorn app.main:app
        --reload
        --workers 1
        --host 0.0.0.0
        --port 8000
    volumes:
      - ./project:/usr/src/app  # hot-reload (dev only)
    ports:
      - "8004:8000"
    depends_on:
      db:
        condition: service_healthy
    # user không cần set ở đây vì Dockerfile đã USER appuser

  # ── Integration Test Runner ───────────────────────────────
  test:
    build:
      context: ./project
      dockerfile: Dockerfile
      target: builder           # dùng builder stage có đủ dev tools
    container_name: songs_test
    env_file:
      - .env
    environment:
      DATABASE_URL: ${TEST_DATABASE_URL:-${DATABASE_URL}}
    volumes:
      - ./project:/usr/src/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      python -m pytest tests/integration/
        -v
        --tb=short
        --cov=app
        --cov-report=term-missing
        --cov-report=xml:/usr/src/app/coverage.xml
        --cov-fail-under=80
    profiles:
      - test                    # chỉ chạy khi: docker compose --profile test up test
