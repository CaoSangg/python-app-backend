volumes:
  postgres_data:

networks:
  test_db:
    internal: true

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./project
      target: runtime
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./project
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "${APP_HOST_PORT:-8004}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  db_test:
    image: postgres:16-alpine
    command: ["postgres", "-c", "cluster_name=song_management_integration"]
    environment:
      POSTGRES_USER: songs_test_runner
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-}
      POSTGRES_DB: songs_test_db
    tmpfs:
      - /var/lib/postgresql/data
    networks: [test_db]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "songs_test_runner", "-d", "songs_test_db"]
      interval: 3s
      timeout: 3s
      retries: 10
    profiles: [test]

  test:
    build:
      context: ./project
      target: test
    environment:
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-}
      COVERAGE_FILE: /tmp/.coverage
    volumes:
      - ./project:/build:ro
    networks: [test_db]
    depends_on:
      db_test:
        condition: service_healthy
    command: >
      python -m pytest tests/
        --tb=short
        --cov=app
        --cov-branch
        --cov-report=term-missing
        --cov-fail-under=80
        -p no:cacheprovider
    profiles: [test]
