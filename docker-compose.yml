version: "3.8"

volumes:
  postgres_data:
    driver: local

services:

  # ── PostgreSQL 16 ─────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: songs_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Database Migration Runner (Alembic) ───────────────────
  migrate:
    build:
      context: ./project
      dockerfile: Dockerfile
      target: runtime          # dùng chung image với web
    container_name: songs_migration
    restart: "no"              # chỉ chạy 1 lần khi khởi động
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

  # ── FastAPI Application (multi-stage, non-root) ───────────
  web:
    build:
      context: ./project
      dockerfile: Dockerfile
      target: runtime          # chỉ build tới stage "runtime"
    container_name: songs_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: >
      uvicorn app.main:app
        --reload
        --workers 1
        --host 0.0.0.0
        --port 8000
    volumes:
      - ./project:/usr/src/app  # hot-reload (dev only)
    ports:
      - "8004:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ── Test Runner (Unit & Integration Tests) ────────────────
  test:
    build:
      context: ./project
      dockerfile: Dockerfile
      target: builder           # dùng builder stage có đủ dev tools
    container_name: songs_test
    env_file:
      - .env
    environment:
      DATABASE_URL: ${TEST_DATABASE_URL:-${DATABASE_URL}}
      COVERAGE_FILE: /tmp/.coverage
    working_dir: /build
    volumes:
      - ./project:/build:ro     # bind mount source & tests read-only
    depends_on:
      db:
        condition: service_healthy
    command: >
      python -m pytest tests/
        -v
        --tb=short
        --cov=app
        --cov-report=term-missing
        --cov-fail-under=80
        -o cache_dir=/tmp/.pytest_cache
    profiles:
      - test                    # chạy khi: docker compose --profile test run --rm test
