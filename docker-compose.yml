version: "3.8"

# =============================================================
# Named Volume: dữ liệu PostgreSQL tồn tại sau "docker compose down"
# Chỉ mất khi chạy "docker compose down -v"
# =============================================================
volumes:
  postgres_data:
    driver: local

services:

  # ── PostgreSQL 16 ─────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: songs_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── FastAPI Application ───────────────────────────────────
  web:
    build:
      context: ./project
      dockerfile: Dockerfile
    container_name: songs_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: >
      uvicorn app.main:app
        --reload
        --workers 1
        --host 0.0.0.0
        --port 8000
    volumes:
      - ./project:/usr/src/app
    ports:
      - "8004:8000"
    depends_on:
      db:
        condition: service_healthy
